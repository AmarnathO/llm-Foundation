[project]
name = "llm-foundation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "active>=0.0.5a0",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "langchain>=1.4.6",
    "litellm>=1.83.0",
